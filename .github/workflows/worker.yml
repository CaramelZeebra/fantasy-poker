name: Deploy API worker to Cloudflare

# Manual only (Actions tab → Run workflow). Needs repo secrets CLOUDFLARE_API_TOKEN
# (template "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID. To redeploy on every push
# that touches worker/, add:  push: { branches: [main], paths: ['worker/**'] }
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
