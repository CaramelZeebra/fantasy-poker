<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fantasy Poker</title>
  <meta name="description" content="Watch simulated poker hands play out with friends, live.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span>Fantasy Poker</span>
    </div>
    <div class="sync" id="sync"><span class="dot"></span><span id="sync-text">connecting…</span></div>
    <button class="btn" id="edit-table">Edit table</button>
  </header>

  <main class="layout">
    <section class="table-area">
      <div class="table" id="table">
        <div class="rail"><div class="felt"></div></div>
        <div class="center" id="center"></div>
        <div class="seats" id="seats"></div>
      </div>
      <div class="controls" id="controls"></div>
    </section>
    <aside class="side">
      <nav class="tabs" id="tabs">
        <button data-tab="odds">Odds</button>
        <button data-tab="log">Hand log</button>
        <button data-tab="money">Bankrolls</button>
        <button data-tab="history">History</button>
      </nav>
      <div class="panel" id="panel"></div>
    </aside>
  </main>

  <dialog id="editor"></dialog>
  <dialog id="picker"></dialog>
  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
